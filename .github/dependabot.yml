version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # All @fullcalendar/* packages must share one version; bumping one alone
      # mixes v6/v7 types and fails `next build`. Listed first so it wins.
      fullcalendar:
        patterns: ["@fullcalendar/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node major Vercel runs (project setting
      # "Node.js Version" = 24.x). Bump it by hand when the runtime changes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
