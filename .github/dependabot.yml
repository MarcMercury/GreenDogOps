version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # All @fullcalendar/* packages must share one version; bumping one alone
      # mixes v6/v7 types and fails `next build`. Listed first so it wins.
      fullcalendar:
        patterns: ["@fullcalendar/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node major Vercel runs (project setting
      # "Node.js Version" = 24.x). Bump it by hand when the runtime changes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) compiler with no JS API. typescript-eslint
      # (via eslint-config-next 16.4) supports only typescript <6.1.0, so ESLint
      # crashes on load (PR #14). Re-enable when both support it.
      - dependency-name: "typescript"
        versions: [">=7"]
      # FullCalendar 7 ships only core + react; daygrid/timegrid/list/interaction
      # stop at 6.1.x and peer-require core ~6.1, so no consistent v7 set exists
      # and any v7 bump fails `next build` (PRs #18, #20). Upgrading is a manual
      # migration — see docs/agent/improvements.md.
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
